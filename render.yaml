# Render Blueprint: one Docker web service (API + Telegram bot + schedulers) and a Postgres.
# New → Blueprint → this repo; then fill the `sync: false` variables in the dashboard.
services:
  - type: web
    name: thinkread-api
    runtime: docker
    plan: starter
    region: frankfurt
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: TZ
        value: Asia/Tashkent
      - key: BOT_LAUNCH
        value: "true"
      - key: AI_MODE
        value: anthropic
      - key: DATABASE_URL
        fromDatabase:
          name: thinkread-db
          property: connectionString
      - key: DATABASE_SSL
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_TELEGRAM_ID
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: WEBAPP_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false

databases:
  - name: thinkread-db
    plan: basic-256mb
    region: frankfurt
    postgresMajorVersion: "16"
